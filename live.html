<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>MATH 120E — live</title>
<style>
:root{
  --paper:#f4f0e6; --paper-lift:#f8f5ee; --deep:#e7e1d3;
  --ink:#26221d; --ink-soft:#7a7264; --ink-faint:#a89f8e;
  --line:rgba(38,34,29,.12); --line-soft:rgba(38,34,29,.07);
  --accent:#a8432e; --accent-soft:#c98a5e;
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s:8px; --ease:cubic-bezier(.2,.72,.18,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:18px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;padding:calc(var(--s)*4)}
main{max-width:1500px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:calc(var(--s)*4);
  padding-bottom:calc(var(--s)*2);border-bottom:1px solid var(--line);
  margin-bottom:calc(var(--s)*3)}
h1{font-size:26px;font-weight:500;letter-spacing:-.018em}
.n{font:44px/1 var(--mono);color:var(--accent)}
.n span{font-size:13px;letter-spacing:.16em;color:var(--ink-faint);
  display:block;margin-top:4px}
.state{margin-left:auto;font:10px var(--mono);letter-spacing:.16em;color:var(--ink-faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:calc(var(--s)*3)}
.card{border-top:1px solid var(--line-soft);padding-top:calc(var(--s)*1.5)}
.tag{font:9px/1.6 var(--mono);letter-spacing:.16em;color:var(--ink-faint)}
.qt{font-size:16px;line-height:1.4;margin:4px 0 calc(var(--s)*1.5)}
.qt code{font:16px var(--mono);background:var(--paper-lift);padding:1px 4px;border-radius:2px}
sup{font-size:.72em;vertical-align:super;line-height:0}
.bar{display:flex;align-items:center;gap:calc(var(--s));margin-bottom:5px}
.bar .k{font:10px var(--mono);color:var(--ink-faint);min-width:12px}
.bar .track{flex:0 0 32%;height:20px;background:var(--paper-lift);border-radius:2px;
  position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ink-faint);
  transition:width .4s var(--ease)}
.bar.right .fill{background:var(--ink-soft)}
.bar.err .fill{background:var(--accent)}
.bar .v{font:11px var(--mono);color:var(--ink-soft);min-width:2.4rem;text-align:right}
.bar .lab{flex:1 1 auto;font-size:13px;color:var(--ink-soft);min-width:7rem}
.bar.right .lab{color:var(--ink)}
.note{margin-top:6px;font-size:12px;color:var(--accent);line-height:1.45}
.setup{max-width:40rem;font-size:15px;color:var(--ink-soft)}
.setup code{font:13px var(--mono);background:var(--paper-lift);padding:2px 6px;
  border-radius:2px;word-break:break-all}
.card.many{grid-column:span 2}
@media (max-width:900px){.card.many{grid-column:span 1}}
.bar.want .fill{background:var(--ink-soft)}
.bar.want .lab{color:var(--ink)}
.bar.want .k::after{content:"\2022";color:var(--accent);margin-left:3px}
.miss{margin-top:6px;font-size:12px;color:var(--ink-soft);line-height:1.45}
.miss b{color:var(--accent);font-weight:500}
.sec{grid-column:1/-1;font:9px/1.6 var(--mono);letter-spacing:.2em;
  color:var(--ink-faint);margin-top:calc(var(--s)*2)}
</style>

<main>
  <div class=top>
    <h1>Where we&rsquo;re starting from</h1>
    <div class=n id=count>0<span>responses</span></div>
    <div class=state id=state></div>
  </div>
  <div id=body></div>
</main>

<script type=module>
import { Q } from './questions.js';

// Read-only projector view. Polls the Worker every 5 seconds.
const url = new URL(location.href);
const ENDPOINT = 'https://lingering-mouse-baa0.bishallamichhane512.workers.dev';
const KEY = url.searchParams.get('key') || '';
const EVERY = 5000;

const body = document.getElementById('body');
const countEl = document.getElementById('count');
const stateEl = document.getElementById('state');

if (!KEY) {
  body.innerHTML =
    '<div class=setup><p>Open this page with your admin key:</p>' +
    '<p><code>live.html?key=YOUR-ADMIN-KEY</code></p>' +
    '<p style="margin-top:1em">The key stays in this tab&rsquo;s address bar. It is never ' +
    'sent to the students&rsquo; page. This page refreshes itself every five seconds.</p></div>';
} else {
  body.innerHTML = '<div class=grid id=grid></div>';
  tick();
  setInterval(tick, EVERY);
}

async function tick() {
  try {
    const r = await fetch(ENDPOINT + '?key=' + encodeURIComponent(KEY), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    render(j.rows || []);
    stateEl.textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    stateEl.textContent = 'not reaching the worker — ' + e.message;
  }
}

function render(rows) {
  countEl.innerHTML = rows.length + '<span>responses</span>';
  const grid = document.getElementById('grid');
  grid.innerHTML = Q.map((q, i) => {
    const picks = rows.map((r) => (r.answers || []).find((a) => a && a.tag === q.tag))
                      .filter((a) => a && a.answered !== false);
    const head = (q.part ? '<div class=sec>' + q.part + '</div>' : '');
    return head + (q.kind === 'multi' ? many(q, picks) : one(q, picks));
  }).join('');
}

const LETTER = 'ABCDEFG';
const bar = (k, lab, count, n, cls) =>
  '<div class="bar ' + cls + '">' +
    '<span class=k>' + k + '</span>' +
    '<span class=lab>' + lab + '</span>' +
    '<span class=track><span class=fill style="width:' +
      Math.round((count / (n || 1)) * 100) + '%"></span></span>' +
    '<span class=v>' + count + '</span></div>';

const shell = (q, inner, cls) =>
  '<div class="card ' + (cls || '') + '">' +
    '<div class=tag>' + q.tag + '</div>' +
    '<div class=qt>' + q.t + '</div>' + inner + '</div>';

/* one answer: the tally, and the error behind the commonest wrong pick */
function one(q, picks) {
  const n = picks.length;
  const tally = q.o.map((_, j) => picks.filter((p) => p.picked === j).length);
  const worst = tally.map((c, j) => ({ c, j }))
    .filter((v) => q.diag[v.j] && v.c > 0)
    .sort((a, b) => b.c - a.c)[0];
  return shell(q,
    q.o.map((o, j) =>
      bar(LETTER[j], o, tally[j], n, j === q.key ? 'right' : (q.diag[j] ? 'err' : ''))
    ).join('') +
    (worst && worst.c >= Math.max(2, n * 0.15)
      ? '<div class=note>' + worst.c + ' chose ' + LETTER[worst.j] + ' &mdash; ' +
        q.diag[worst.j] + '</div>' : ''));
}

/* several answers: how often each idea was named, marked by whether it
   belongs. The two failures are read off different rows — an idea brought in
   that the problem does not use is a row that should be short and is tall; one
   the problem needs and nobody named is a row that should be tall and is not.
   The second is the more interesting result and is called out below. */
function many(q, picks) {
  const n = picks.length;
  const tally = q.o.map((_, j) => picks.filter((p) => (p.picked || []).includes(j)).length);
  const exact = picks.filter((p) => p.correct).length;
  const gaps = q.keys.map((j) => ({ j, missed: n - tally[j] }))
    .filter((g) => g.missed >= Math.max(2, n * 0.3))
    .sort((a, b) => b.missed - a.missed);
  const brought = q.o.map((_, j) => ({ j, c: tally[j] }))
    .filter((v) => q.diag[v.j] && v.c >= Math.max(2, n * 0.15))
    .sort((a, b) => b.c - a.c)[0];
  return shell(q,
    q.o.map((o, j) =>
      bar(LETTER[j], o, tally[j], n, q.keys.includes(j) ? 'want' : 'err')
    ).join('') +
    '<div class=miss>' + exact + ' of ' + n + ' named exactly the right set.' +
    gaps.map((g) => '<br><b>' + g.missed + ' did not name ' + LETTER[g.j] +
      '</b> &mdash; ' + q.miss[g.j]).join('') +
    (brought ? '<br>' + brought.c + ' brought in ' + LETTER[brought.j] + ' &mdash; ' +
      q.diag[brought.j] : '') +
    '</div>', 'many');
}
</script>
</html>
