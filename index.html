<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>MATH 120E — first day</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("m120.theme")||"ink"}catch(e){}</script>
<style>
:root{
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s:8px; --ease:cubic-bezier(.2,.72,.18,1);
}
/* ══ themes ══════════════════════════════════════════════════════
   Every text-carrying pair in each palette clears WCAG AA: 4.5:1 for the
   small mono labels and statements, 7:1 for body text. The previous
   --ink-faint was 2.30:1 against paper and carried every label on the site,
   which is why the type read as faint rather than quiet. */
:root[data-theme="paper"]{
  --paper:#f4f0e6; --paper-lift:#faf7f0; --deep:#e7e1d3; --rail-paper:#efe9db;
  --ink:#231f1a; --ink-soft:#5c554a; --ink-faint:#6f685b;
  --line:rgba(35,31,26,.16); --line-soft:rgba(35,31,26,.09);
  --accent:#9c3b27; --accent-soft:#8a5a34;
  --accent-tint:rgba(156,59,39,.10);
  --glow:#faf7f0; --shade:rgba(35,31,26,.30);
}
:root[data-theme="slate"]{
  --paper:#eef0f3; --paper-lift:#f6f7f9; --deep:#dde1e7; --rail-paper:#e5e8ec;
  --ink:#1b2027; --ink-soft:#4d5661; --ink-faint:#606975;
  --line:rgba(27,32,39,.16); --line-soft:rgba(27,32,39,.09);
  --accent:#2f5d8c; --accent-soft:#5a5f8a;
  --accent-tint:rgba(47,93,140,.10);
  --glow:#f6f7f9; --shade:rgba(27,32,39,.30);
}
:root[data-theme="sage"]{
  --paper:#edf0ea; --paper-lift:#f5f7f2; --deep:#dbe0d5; --rail-paper:#e4e8df;
  --ink:#1d2320; --ink-soft:#4e5851; --ink-faint:#606a62;
  --line:rgba(29,35,32,.16); --line-soft:rgba(29,35,32,.09);
  --accent:#7a3b32; --accent-soft:#4f6b52;
  --accent-tint:rgba(122,59,50,.10);
  --glow:#f5f7f2; --shade:rgba(29,35,32,.30);
}
:root, :root[data-theme="ink"]{
  --paper:#1b1e22; --paper-lift:#23272c; --deep:#141619; --rail-paper:#171a1e;
  --ink:#e8e6e1; --ink-soft:#b3b0a9; --ink-faint:#948f86;
  --line:rgba(255,255,255,.16); --line-soft:rgba(255,255,255,.09);
  --accent:#d98a6a; --accent-soft:#c8a678;
  --accent-tint:rgba(217,138,106,.16);
  --glow:#23272c; --shade:rgba(0,0,0,.5);
}

/* the ground wash follows the theme instead of a baked-in cream */
body::before{background:radial-gradient(120% 90% at 50% 0%,
  var(--glow) 0%,var(--paper) 42%,var(--deep) 100%)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.62 var(--sans);
  -webkit-font-smoothing:antialiased;padding:calc(var(--s)*5) calc(var(--s)*3) calc(var(--s)*14)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 0%,var(--glow) 0%,var(--paper) 42%,var(--deep) 100%)}
main{max-width:38rem;margin:0 auto}
h1{font-size:27px;font-weight:500;letter-spacing:-.018em;line-height:1.24}
.eyebrow{font:9px/1.6 var(--mono);letter-spacing:.2em;color:var(--ink-faint);
  margin-bottom:calc(var(--s))}
.lede{color:var(--ink-soft);margin:calc(var(--s)*1.5) 0 calc(var(--s)*4);max-width:34rem}

.q{padding:calc(var(--s)*3) 0;border-top:1px solid var(--line-soft)}
.q-n{font:9px/1.7 var(--mono);letter-spacing:.16em;color:var(--ink-faint)}
.q-t{font-size:16.5px;line-height:1.5;margin:calc(var(--s)*.75) 0 calc(var(--s)*1.75)}
.q-t code{font:17px var(--mono);background:var(--paper-lift);padding:1px 5px;
  border-radius:2px;letter-spacing:.01em}
sup{font-size:.72em;vertical-align:super;line-height:0}
.opt{display:flex;gap:calc(var(--s)*1.25);align-items:baseline;padding:6px 9px;
  border:1px solid transparent;border-radius:2px;cursor:pointer;
  transition:background .14s var(--ease),border-color .14s var(--ease)}
.opt:hover{background:var(--paper-lift)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt input{accent-color:var(--accent);margin-top:5px}
.opt .k{font:10px/1.7 var(--mono);color:var(--ink-faint);min-width:13px}
.opt .v{flex:1;font-size:15px}
.opt .v code{font:15px var(--mono)}

.foot{margin-top:calc(var(--s)*5);padding-top:calc(var(--s)*2.5);
  border-top:1px solid var(--line)}
button.go{font:11px var(--mono);letter-spacing:.16em;background:none;
  border:1px solid var(--ink-soft);color:var(--ink);padding:11px 20px;
  border-radius:2px;cursor:pointer;transition:color .14s var(--ease),border-color .14s var(--ease)}
button.go:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
button.go:disabled{opacity:.45;cursor:default}
.count{font:10.5px var(--mono);color:var(--ink-faint);margin-left:calc(var(--s)*2)}
.done{margin-top:calc(var(--s)*2.5);padding-left:calc(var(--s)*1.75);
  border-left:1px solid var(--accent-soft);font-size:14px;color:var(--ink-soft)}
.done b{color:var(--ink);font-weight:500}
.done a{color:var(--accent)}

.part{margin:calc(var(--s)*5) 0 calc(var(--s)*1.5);padding-top:calc(var(--s)*2);
  border-top:1px solid var(--line)}
.part:first-of-type{margin-top:calc(var(--s)*3)}
.part h2{font-size:15px;font-weight:500;letter-spacing:-.005em}
.part .pn{font:9px/1.6 var(--mono);letter-spacing:.2em;color:var(--ink-faint)}
.part p{margin-top:calc(var(--s));font-size:14px;color:var(--ink-soft);
  padding-left:calc(var(--s)*1.5);border-left:1px solid var(--accent-soft)}
.q .many{font:9px/1.7 var(--mono);letter-spacing:.16em;color:var(--accent);
  margin-bottom:calc(var(--s))}
/* A checkbox is square and a radio is round, which is the only cue that says
   more than one answer is allowed. Do not restyle them into each other. */
.opt input[type=checkbox]{border-radius:0}
.opt.multi:has(input:checked){border-color:var(--accent-soft)}

#theme{position:fixed;right:calc(var(--s)*2);bottom:calc(var(--s)*2);z-index:40;
  display:flex;gap:5px;padding:7px 9px;border-radius:99px;
  background:var(--paper-lift);border:1px solid var(--line)}
#theme button{width:17px;height:17px;border-radius:50%;cursor:pointer;padding:0;
  border:1px solid var(--line);transition:transform .14s var(--ease)}
#theme button:hover{transform:scale(1.14)}
#theme button[aria-pressed=true]{box-shadow:0 0 0 2px var(--paper-lift),0 0 0 3.5px var(--accent)}
#theme button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<main>
  <div class=eyebrow>math 120e &middot; fall 2026</div>
  <h1>Where we&rsquo;re starting from</h1>

  <form id=quiz></form>

  <div class=foot>
    <button class=go id=send disabled>submit</button>
    <span class=count id=count></span>
    <div class=done id=done hidden></div>
  </div>
</main>

<script type=module>
import { Q } from './questions.js';

// ── where responses go ───────────────────────────────────────────────
// Set ENDPOINT to '' to run with no backend: answers stay in the browser and
// the student downloads a small file. See README.md.
const ENDPOINT = 'https://math120e-diagnostic-api.bishallamichhane512.workers.dev';
const CLASS_CODE = 'MATH120E-F26';

// ── the questions ────────────────────────────────────────────────────
// the questions live in questions.js


// ── local store ──────────────────────────────────────────────────────
// Every submission is written here first, whether or not it is also sent.
const KEY = 'm120.diag.';
function keep(payload) {
  try { localStorage.setItem(KEY + payload.session, JSON.stringify(payload)); } catch {}
}
function stored() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(KEY)) out.push(JSON.parse(localStorage.getItem(k)));
    }
  } catch {}
  return out.sort((a, b) => (a.at || '').localeCompare(b.at || ''));
}
// Recovery, for pulling responses off a device that could not send:
//   open this page with #recover
if (location.hash === '#recover') {
  addEventListener('DOMContentLoaded', () => {
    const rows = stored();
    const blob = new Blob([rows.map((r) => JSON.stringify(r)).join('\n')],
                          { type: 'application/x-ndjson' });
    document.body.innerHTML =
      '<main><h1>' + rows.length + ' response' + (rows.length === 1 ? '' : 's') +
      ' on this device</h1><p class=lede><a href="' + URL.createObjectURL(blob) +
      '" download="diagnostic-recovered.jsonl">Download them all</a></p></main>';
  });
}

// ── render ───────────────────────────────────────────────────────────
const session = 's' + Math.random().toString(36).slice(2, 10);
const t0 = Date.now();
const form = document.getElementById('quiz');

// One entry per question: an index for a single-answer question, a sorted
// array of indices for a multi-answer one, null for untouched.
const picked = new Array(Q.length).fill(null);
const LETTER = 'ABCDEFG';
const answered = () => picked.filter(
  (p) => p !== null && !(Array.isArray(p) && p.length === 0)).length;

Q.forEach((q, i) => {
  if (q.part) {
    const h = document.createElement('div');
    h.className = 'part';
    h.innerHTML = '<div class=pn>part ' + LETTER[form.querySelectorAll('.part').length] +
      '</div><h2>' + q.part + '</h2>' + (q.note ? '<p>' + q.note + '</p>' : '');
    form.appendChild(h);
  }
  const many = q.kind === 'multi';
  const d = document.createElement('div');
  d.className = 'q';
  d.innerHTML =
    '<div class=q-n>' + String(i + 1).padStart(2, '0') + '</div>' +
    '<div class=q-t>' + q.t + '</div>' +
    (many ? '<div class=many>choose all that apply</div>' : '') +
    q.o.map((o, j) =>
      '<label class="opt' + (many ? ' multi' : '') + '">' +
      '<input type=' + (many ? 'checkbox' : 'radio') +
      ' name=q' + i + ' value=' + j + '>' +
      '<span class=k>' + LETTER[j] + '</span><span class=v>' + o + '</span></label>'
    ).join('');
  form.appendChild(d);
});

form.addEventListener('change', (e) => {
  const m = /^q(\d+)$/.exec(e.target.name || '');
  if (!m) return;
  const i = +m[1];
  if (Q[i].kind === 'multi') {
    picked[i] = [...form.querySelectorAll('input[name=q' + i + ']:checked')]
      .map((n) => +n.value).sort((a, b) => a - b);
  } else {
    picked[i] = +e.target.value;
  }
  const n = answered();
  document.getElementById('count').textContent = n + ' of ' + Q.length + ' answered';
  document.getElementById('send').disabled = n === 0;
});

// What a single question contributes to the payload. A multi-answer question
// reports two kinds of mistake separately: an idea brought in that the problem
// does not use, and one the problem uses that was left out. They are not the
// same error and lumping them into "wrong" throws away the distinction.
const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
function record(q, p) {
  const base = { obj: q.obj, tag: q.tag, kind: q.kind || 'mc' };
  if (q.kind === 'multi') {
    const got = p || [];
    return { ...base, picked: got, answered: got.length > 0,
             correct: same(got, q.keys),
             extra: got.filter((j) => !q.keys.includes(j)),
             missed: q.keys.filter((j) => !got.includes(j)) };
  }
  return { ...base, picked: p, answered: p !== null,
           correct: p === q.key,
           error: (p !== null && q.diag[p]) || null };
}

// ── submit ───────────────────────────────────────────────────────────
document.getElementById('send').onclick = async () => {
  const btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = 'sending';

  const payload = {
    code: CLASS_CODE,
    session,
    at: new Date().toISOString(),
    ms: Date.now() - t0,
    answers: Q.map((q, i) => record(q, picked[i])),
  };

  const tried = payload.answers.filter((a) => a.answered);
  const right = tried.filter((a) => a.correct).length;
  const total = tried.length;
  const done = document.getElementById('done');

  // persist before anything else
  keep(payload);

  if (!ENDPOINT) {
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    done.innerHTML = '<b>Done. ' + right + ' of ' + total + ' correct.</b> ' +
      'Your answers are saved on this device. ' +
      '<a id=dl href="' + url + '" download="diagnostic-' + session + '.json">Download the file</a> ' +
      'and hand it in.';
    done.hidden = false;
    btn.textContent = 'saved on this device';
    return;
  }

  try {
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    done.innerHTML = '<b>Recorded. Thank you.</b> ' + right + ' of ' +
      total + ' correct. That is not a grade and is not kept against your ' +
      'name.';
    btn.textContent = 'sent';
  } catch (err) {
    done.innerHTML = '<b>That did not send.</b> Your answers were saved on this ' +
      'device instead. Please tell me, and leave this tab open. (' + err.message + ')';
    btn.textContent = 'retry';
    btn.disabled = false;
  }
  done.hidden = false;
};
</script>
<script>
// the palette, shared with the course site through one localStorage key
(function () {
  var T = [['paper','#f4f0e6','#9c3b27'],['slate','#eef0f3','#2f5d8c'],
           ['sage','#edf0ea','#7a3b32'],['ink','#1b1e22','#d98a6a']];
  var cur = function () { try { return localStorage.getItem('m120.theme') || 'ink'; } catch (e) { return 'ink'; } };
  var box = document.createElement('div');
  box.id = 'theme';
  box.innerHTML = T.map(function (t) {
    return '<button data-t="' + t[0] + '" title="' + t[0] + '" aria-label="' + t[0] +
      ' theme" aria-pressed="' + (cur() === t[0]) + '" style="background:' + t[1] +
      ';border-color:' + t[2] + '"></button>';
  }).join('');
  box.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]');
    if (!b) return;
    var id = b.getAttribute('data-t');
    document.documentElement.dataset.theme = id;
    try { localStorage.setItem('m120.theme', id); } catch (e2) {}
    box.querySelectorAll('button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x.getAttribute('data-t') === id));
    });
  });
  document.body.appendChild(box);
})();
</script>
</html>
